# http context: install as /etc/nginx/conf.d/vps-monitor-limits.conf
# These zones are used only by the vps-monitor.net virtual host.
limit_req_zone $binary_remote_addr zone=vps_monitor_login:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=vps_monitor_register:1m rate=3r/m;
limit_req_zone $binary_remote_addr zone=vps_monitor_metrics:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=vps_monitor_api:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=vps_monitor_client:1m;
limit_conn_zone $server_name zone=vps_monitor_total:1m;

upstream vps_monitor_backend {
    server unix:/run/vps-monitor/gunicorn.sock;
    keepalive 8;
}
