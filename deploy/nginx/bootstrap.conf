# Temporary HTTP-only configuration to obtain the first certificate.
# API and frontend are not served before HTTPS is configured.
server {
    listen 80;
    listen [::]:80;
    server_name vps-monitor.net;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/vps-monitor-acme;
    }

    location / {
        return 404;
    }
}
