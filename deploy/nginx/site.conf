server {
    listen 80;
    listen [::]:80;
    server_name vps-monitor.net;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/vps-monitor-acme;
    }
    location / {
        return 308 https://vps-monitor.net$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vps-monitor.net;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/vps-monitor.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-monitor.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:VPSMonitorSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn vps_monitor_client 12;
    limit_conn vps_monitor_total 64;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Muitas tentativas. Aguarde um minuto e tente novamente."}';
    }

    location = /api/auth/login {
        limit_req zone=vps_monitor_login burst=3 nodelay;
        include /etc/nginx/snippets/vps-monitor-proxy.conf;
    }
    location = /api/auth/register {
        limit_req zone=vps_monitor_register burst=2 nodelay;
        include /etc/nginx/snippets/vps-monitor-proxy.conf;
    }
    location = /api/vps {
        limit_req zone=vps_monitor_metrics burst=3 nodelay;
        include /etc/nginx/snippets/vps-monitor-proxy.conf;
    }
    location = /api/vps/debug-ssh {
        return 404;
    }
    location /api/ {
        limit_req zone=vps_monitor_api burst=10 nodelay;
        include /etc/nginx/snippets/vps-monitor-proxy.conf;
    }
    location ~ /\. {
        return 404;
    }
    location / {
        include /etc/nginx/snippets/vps-monitor-proxy.conf;
    }
}
